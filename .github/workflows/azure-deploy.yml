name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://protein-prep-week.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node scripts/build.mjs

      - name: Assemble deployable files
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app.js data.js nutrition.js labels.js dist/
          cp -R recipes dist/recipes
          ls -R dist | head -50

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: protein-prep-week
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
